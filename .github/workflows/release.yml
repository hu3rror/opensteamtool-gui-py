name: Build and Auto Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Executable
        run: |
          pyinstaller --noconfirm --onefile --noconsole --icon=app.ico --add-data "app.ico;." --name "OpenSteamToolManager" main.py

      - name: Compress Release Package
        shell: powershell
        run: |
          # 创建打包临时目录
          New-Item -ItemType Directory -Path "dist_release"
          
          # 复制打包好的 EXE
          Copy-Item "dist/OpenSteamToolManager.exe" -Destination "dist_release/"
          
          # 如果仓库根目录下存在 dlls 文件夹，一并复制；不存在则新建空目录
          if (Test-Path "dlls") {
              Copy-Item -Recurse "dlls" -Destination "dist_release/"
          } else {
              New-Item -ItemType Directory -Path "dist_release/dlls"
          }
          
          # 获取 Tag 版本名称
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "latest" }
          
          # 拼接 ZIP 文件名
          $zipName = "OpenSteamTool-$tag-Release.zip"
          
          # 打包为 ZIP 压缩包
          Compress-Archive -Path "dist_release/*" -DestinationPath $zipName
          
          # 设置环境变量供后续 Step 读取
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true # 自动根据 Commit 生成版本更新说明
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}